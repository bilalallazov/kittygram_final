# Скопируйте в /etc/nginx/sites-available/ (например taski.conf),
# ВАЖНО: замените 8000 на порт, где у вас реально слушает Taski (см. ss -tulpen на сервере).
# sudo ln -sf /etc/nginx/sites-available/taski.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d mytaski.myftp.org

server {
    listen 80;
    server_name mytaski.myftp.org;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
