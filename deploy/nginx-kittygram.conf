# Скопируйте в /etc/nginx/sites-available/ (например kittygram.conf),
# затем: sudo ln -sf /etc/nginx/sites-available/kittygram.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d mykittygramqqqwww.hopto.org

server {
    listen 80;
    server_name mykittygramqqqwww.hopto.org;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
