name: Kittygram CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate_tests_yml:
    name: Check tests.yml (no lesson placeholders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholder values in tests.yml
        run: |
          set -e
          test -f tests.yml
          if grep -qE 'your-kittygram-domain|your-taski-domain|your_github_login|your_dockerhub_login|ваш_логин_на_гитхабе|ваш_логин_на_докерхабе' tests.yml; then
            echo '::error title=tests.yml::В tests.yml остались заглушки из методички. Укажите реальные kittygram_domain, taski_domain, repo_owner, dockerhub_username и закоммитьте снова.'
            exit 1
          fi

  backend_lint:
    name: Backend lint (flake8)
    runs-on: ubuntu-latest
    needs: [validate_tests_yml]
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: flake8 backend/

  backend_tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    needs: [validate_tests_yml]
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      # test_connection.py ходит по HTTPS к доменам из tests.yml — в CI без живых
      # сайтов шаг падает и блокирует деплой. Полный прогон: pytest (локально).
      - name: Run pytest
        run: pytest --ignore=tests/test_connection.py

  frontend_tests:
    name: Frontend tests (npm)
    runs-on: ubuntu-latest
    needs: [validate_tests_yml]
    env:
      CI: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false

  build_and_push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [backend_lint, backend_tests, frontend_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker Hub secrets exist
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo '::error::В репозитории не заданы DOCKERHUB_USERNAME или DOCKERHUB_TOKEN. GitHub → Settings → Secrets and variables → Actions → New repository secret. Токен только с hub.docker.com (Access Token), не пароль от сайта.'
            exit 1
          fi
      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Убираем пробелы/переносы по краям (частая причина сбоя после вставки в GitHub)
          USER_TRIMMED=$(printf '%s' "$DOCKER_USER" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          PASS_TRIMMED=$(printf '%s' "$DOCKER_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$USER_TRIMMED" ] || [ -z "$PASS_TRIMMED" ]; then
            echo '::error::DOCKERHUB_USERNAME или DOCKERHUB_TOKEN пустые после trim.'
            exit 1
          fi
          printf '%s' "$PASS_TRIMMED" | docker login -u "$USER_TRIMMED" --password-stdin docker.io
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest
      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/kittygram"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.production.yml pull
              docker compose -f docker-compose.production.yml up -d
              docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
              docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            else
              docker-compose -f docker-compose.production.yml pull
              docker-compose -f docker-compose.production.yml up -d
              docker-compose -f docker-compose.production.yml exec -T backend python manage.py migrate
              docker-compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            fi

      - name: Send Telegram notification
        if: success()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: Kittygram deployed successfully.

